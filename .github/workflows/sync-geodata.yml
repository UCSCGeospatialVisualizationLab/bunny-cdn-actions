name: Sync geodata to Bunny Storage

# Caller owns checkout path filters and secrets: inherit.
# The sync-geodata composite extracts CDN_ASSET_S3_OBJECTS from the caller's
# catalog module (unless catalog-file is set) via lib/extract-export.mjs.
on:
  workflow_call:
    inputs:
      catalog-module:
        description: Path to the leaf cdnAssets module in the caller checkout
        type: string
        required: false
        default: src/cdnAssets.ts
      catalog-export:
        description: Named export listing S3 object paths
        type: string
        required: false
        default: CDN_ASSET_S3_OBJECTS
      catalog-file:
        description: Skip extract; use this catalog file (debug override only)
        type: string
        required: false
        default: ''
      cdn-host:
        description: Smoke host for verify (default vars.APP_URL from the job's environment)
        type: string
        required: false
        default: ''
      verify:
        description: Run CDN smoke after copy (ignored on pull_request)
        type: boolean
        required: false
        default: true
      dry-run:
        description: Pass --dry-run to copy
        type: boolean
        required: false
        default: false

jobs:
  sync:
    name: Sync geodata catalog
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    timeout-minutes: 360
    steps:
      - name: Checkout caller
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: inputs.catalog-file == ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Relative ./sync-geodata resolves in the *caller* checkout; pin the
      # composite to the same major tag as this reusable workflow.
      - name: Sync geodata
        uses: UCSCGeospatialVisualizationLab/bunny-cdn-actions/sync-geodata@v1
        with:
          catalog-module: ${{ inputs.catalog-module }}
          catalog-export: ${{ inputs.catalog-export }}
          catalog-file: ${{ inputs.catalog-file }}
          check-source-only: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          verify: ${{ github.event_name != 'pull_request' && inputs.verify && 'true' || 'false' }}
          # Resolved here, not in the caller: environment-scoped APP_URL is only
          # visible inside this job, which is the one bound to the environment.
          cdn-host: ${{ inputs.cdn-host || vars.APP_URL }}
          dry-run: ${{ inputs.dry-run && 'true' || 'false' }}
        env:
          NAUTILUS_ACCESS_KEY_ID: ${{ secrets.NAUTILUS_GEODATA_ACCESS_KEY_ID }}
          NAUTILUS_SECRET_ACCESS_KEY: ${{ secrets.NAUTILUS_GEODATA_SECRET_ACCESS_KEY }}
          NAUTILUS_S3_HOST: ${{ vars.NAUTILUS_S3_HOST }}
          BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          BUNNY_STORAGE_HOST: ${{ vars.BUNNY_STORAGE_HOST }}
